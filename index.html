<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國際新視界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f4fa3;
    --blue-deep:#163a7c;
    --ink:#ffffff;
    --zh:"LXGW WenKai TC","Kaiti TC","DFKai-SB","Microsoft JhengHei",serif;
    --en:"Caveat","LXGW WenKai TC",cursive;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--blue);color:var(--ink);font-family:var(--zh)}
  #stage{position:fixed;inset:0;background:radial-gradient(ellipse at center,var(--blue) 55%,var(--blue-deep) 100%)}
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:44px 44px}
  #blackout{position:fixed;inset:0;background:#000}
  #svg{position:fixed;inset:0;width:100%;height:100%}
  #flash{position:fixed;left:50%;top:50%;width:10vmax;height:10vmax;margin:-5vmax 0 0 -5vmax;border-radius:50%;
    background:radial-gradient(circle,#fff 0 35%,rgba(255,255,255,.75) 55%,rgba(255,255,255,0) 70%);
    visibility:hidden;opacity:0;pointer-events:none}

  /* ---------- SVG ink ---------- */
  #world{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  #world text{fill:#fff;stroke:none}
  #world .zh{font-family:var(--zh)}
  #world .en{font-family:var(--en);font-weight:700}
  #world .b{font-weight:700}
  #world .thin{stroke-width:2.2;stroke-opacity:.55}
  #world .fine{stroke-width:2.6}
  #world .w{fill:#fff}
  #world .fb{fill:var(--blue)}
  #world .t-dash{stroke-width:3;stroke-dasharray:14 12}
  #world .cube polygon{stroke-width:2.6}
  #world .cube .top{fill:#3d74d2}
  #world .cube .l{fill:#2a5db8}
  #world .cube .r{fill:#1d4996}
  #world .cube.dark .top{fill:#26457f} #world .cube.dark .l{fill:#1b3568} #world .cube.dark .r{fill:#142a55}
  #world .cube.white polygon{stroke:#9fb9e8} #world .cube.white .top{fill:#fff} #world .cube.white .l{fill:#e8effb} #world .cube.white .r{fill:#d3e0f5}
  #world .cube.leaf .top{fill:#5a92e6} #world .cube.leaf .l{fill:#4279d0} #world .cube.leaf .r{fill:#3266b8}
  #world .cube.trunk .top{fill:#2a5db8} #world .cube.trunk .l{fill:#1f4c9c} #world .cube.trunk .r{fill:#183f86}
  #world .cube.water .top{fill:#8ab8f5} #world .cube.water .l{fill:#5d93e0} #world .cube.water .r{fill:#4d82d6}
  #world .nose{fill:#0e214b;stroke-width:1.5}
  #world .pb{fill:#2c64c6}
  #world .wind{stroke-width:2;stroke-dasharray:9 15;stroke-opacity:.75}

  /* ---------- page flip ---------- */
  #flip{position:fixed;inset:0;perspective:1800px;pointer-events:none}
  .page{position:absolute;inset:0;visibility:hidden;opacity:0;background-color:var(--blue);
    background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:44px 44px;box-shadow:inset 40px 0 80px rgba(0,0,0,.28),inset -10px 0 30px rgba(255,255,255,.08)}
  .page::after{content:"";position:absolute;right:0;bottom:0;width:9vmin;height:9vmin;
    background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.85) 50%,#dfe8f8 100%);border-top-left-radius:6px}
  .pgin{position:absolute;inset:5vmin;border:3px solid #fff;
    border-radius:36px 10px 28px 12px/12px 30px 10px 34px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;text-align:center}
  .pgin h2{margin:0;font-size:clamp(56px,11vw,170px);font-weight:700;letter-spacing:.08em}
  .pgin p{margin:0;font-size:clamp(20px,3.2vw,46px)}
  .pgin small{font-family:var(--en);font-size:clamp(20px,2.8vw,40px);opacity:.85}
  .pgno{position:absolute;left:3vmin;bottom:2vmin;font-family:var(--en);font-size:clamp(18px,2.4vw,34px);opacity:.8}

  /* ---------- subtitles ---------- */
  #subs{position:fixed;inset:0;pointer-events:none}
  .sub{position:absolute;left:16px;right:16px;bottom:calc(9vh + 44px);margin:0;text-align:center;
    font-size:clamp(20px,3.4vw,52px);line-height:1.35;letter-spacing:.06em;visibility:hidden;opacity:0;
    text-shadow:0 2px 0 rgba(10,30,80,.55),0 0 18px rgba(10,30,80,.6)}
  .sub.low{bottom:74px}
  .en-sub{font-family:var(--en);font-weight:700;font-size:1.15em;letter-spacing:.02em;white-space:nowrap}
  .sub.top{top:7vh;bottom:auto;font-size:clamp(24px,4.4vw,68px);font-weight:700}

  /* ---------- controls ---------- */
  #ctrl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    padding:6px 12px;opacity:.55;transition:opacity .3s}
  #ctrl:hover,#ctrl:focus-within{opacity:1}
  #ctrl,#scrub{transition:opacity .4s}
  body.idle #ctrl,body.idle #scrub{opacity:0;pointer-events:none}
  body.idle{cursor:none}
  #ctrl button{font-family:var(--en);font-size:20px;line-height:1;color:#fff;background:rgba(255,255,255,.06);
    border:2px solid #fff;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
    min-width:38px;height:38px;cursor:pointer;padding:0 8px}
  #ctrl button:hover{background:rgba(255,255,255,.18)}
  #ctrl button.on{background:#fff;color:var(--blue)}
  #ctrl button[disabled]{opacity:.35;cursor:not-allowed}
  #dots{display:flex;gap:6px}
  #dots button{min-width:34px;height:34px;font-size:19px}
  #ctrl{bottom:30px}
  #dots,#clock,.mark b{display:none}
  #clock{font-family:var(--en);font-size:22px;min-width:118px;text-align:center;font-variant-numeric:tabular-nums;cursor:copy;user-select:none}
  #scrub{position:fixed;left:16px;right:16px;bottom:4px;height:24px;cursor:pointer;touch-action:none;outline:none}
  #track{position:absolute;left:0;right:0;top:11px;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:2px}
  #knob{position:absolute;top:50%;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(31,79,163,.6)}
  #scrub:focus-visible #knob{box-shadow:0 0 0 3px #fff8}
  .mark{position:absolute;top:-5px;width:2px;height:13px;margin-left:-1px;background:#fff;opacity:.75}
  .mark b{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font:700 12px var(--en);opacity:.9}
  #tip{position:absolute;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--blue);font:700 15px var(--en);
    padding:2px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;display:none}
  #scrub:hover #tip,#scrub.drag #tip{display:block}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:var(--blue);font:700 16px var(--zh);
    padding:4px 12px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none}
  @media (max-width:520px){
    #ctrl{gap:6px;bottom:28px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px)}
    #ctrl button{min-width:32px;height:32px;font-size:17px}
    #dots button{min-width:28px;height:28px;font-size:16px}
    .sub{bottom:calc(5vh + 40px)}
    .sub.low{bottom:76px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="blackout"></div>

<svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs id="defs">
    <filter id="rough" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g id="world" filter="url(#rough)">
    <g id="s1">
      <text id="who" class="en" x="960" y="470" font-size="140" text-anchor="middle"></text>
      <text id="why" class="zh" x="960" y="650" font-size="92" text-anchor="middle"></text>
    </g>
    <g id="school"></g>
    <g id="earth"></g>
    <g id="kw"></g>
    <g id="ant"></g>
    <g id="tw"></g>
    <g id="farmWrap"><g id="farmCam"></g></g>
    <g id="cat"></g>
    <g id="bear" transform="translate(0,-80)"></g>
    <g id="s4"></g>
    <g id="s5"></g>
    <g id="plane"><g id="planeBob">
      <!-- invisible, symmetric box: makes the plane's bbox centre = its own centre (0,0), so it pivots on the trail line -->
      <rect x="-150" y="-45" width="300" height="90" style="fill:none;stroke:none"/>
      <g transform="scale(1.5)">
        <path class="wind" d="M-78,-12 L-34,-12"/>
        <path class="wind" d="M-92,3 L-30,3"/>
        <path class="wind" d="M-74,17 L-36,17"/>
        <path class="pb" d="M34,0 L-26,-20 L-13,0 L-26,20 Z"/>
        <path d="M34,0 L-13,0"/>
        <path class="pb" d="M-13,0 L-20,11 L34,0 Z"/>
      </g>
    </g></g>
  </g>
</svg>

<div id="flash"></div>

<div id="flip">
  <div class="page" id="page1"><div class="pgin">
    <h2>淺山</h2><p>石虎的家</p><small>Leopard Cat · Shallow Mountains</small>
  </div><span class="pgno">p.1</span></div>
  <div class="page" id="page2"><div class="pgin">
    <h2>森林</h2><p>台灣黑熊的家</p><small>Formosan Black Bear · Forest</small>
  </div><span class="pgno">p.2</span></div>
</div>

<div id="subs">
  <p class="sub" id="sub0">國際新視界從內壢高中出發</p>
  <p class="sub" id="sub1">從認識社會創新競賽</p>
  <p class="sub" id="sub2">學會探究問題、解決問題的方法</p>
  <p class="sub" id="sub3">找到人生的志業</p>
  <p class="sub" id="sub4">回到台灣，把關心化為行動</p>
  <p class="sub" id="sub5">沿著田間小路，走進埤塘與里山</p>
  <p class="sub" id="sub5b">認識台灣瀕臨絕種生物，守護生物多樣性</p>
  <p class="sub" id="sub6">守護台灣，有我有妳，我們一起努力！</p>
  <p class="sub low" id="sub7">透過 Minecraft 實現創造力，為生物多樣性發聲</p>
  <p class="sub low" id="sub8">內高學生舉辦公益營隊</p>
  <p class="sub low" id="sub9">帶著孩子們，一起共學共好</p>
</div>

<nav id="ctrl" aria-label="播放控制">
  <button id="btnPlay" title="暫停 / 播放（空白鍵）" aria-label="暫停">❚❚</button>
  <div id="dots">
    <button data-l="s1" title="第一幕 Who am I?">1</button>
    <button data-l="s2" title="第二幕 起飛到南極">2</button>
    <button data-l="s3" title="第三幕 回到台灣">3</button>
    <button data-l="s4" title="第四幕 共學共好">4</button>
    <button data-l="s5" title="第五幕 歡迎加入">5</button>
  </div>
  <button id="btnReplay" title="重播" aria-label="重播">↺</button>
  <button id="btnMusic" title="背景音樂" aria-label="音樂">♪</button>
  <span id="clock" title="點一下複製目前時間">0.0s / 0.0s</span>
</nav>
<div id="scrub" role="slider" tabindex="0" aria-label="時間軸" aria-valuemin="0">
  <div id="track"><div id="fill"></div><div id="marks"></div><div id="knob"></div></div>
  <div id="tip">0.0s</div>
</div>
<div id="toast"></div>
<audio id="bgm" src="小苗快長大 (2).mp3" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
<script>
gsap.registerPlugin(MotionPathPlugin);
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const r1 = n => Math.round(n * 10) / 10;

/* ================= drawing helpers ================= */
let seed = 11;
function rand() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// Catmull-Rom → cubic Bézier, gives a hand-drawn smooth line through points
function smooth(p, closed = false) {
  const n = p.length, g = i => closed ? p[(i + n) % n] : p[Math.max(0, Math.min(n - 1, i))];
  let d = `M${r1(p[0][0])},${r1(p[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = g(i - 1), b = g(i), c = g(i + 1), e = g(i + 2);
    d += ` C${r1(b[0] + (c[0] - a[0]) / 6)},${r1(b[1] + (c[1] - a[1]) / 6)} ${r1(c[0] - (e[0] - b[0]) / 6)},${r1(c[1] - (e[1] - b[1]) / 6)} ${r1(c[0])},${r1(c[1])}`;
  }
  return d + (closed ? 'Z' : '');
}
const P = (d, cls, extra = '') => `<path d="${d}"${cls ? ` class="${cls}"` : ''}${extra}/>`;
const circ = (x, y, r, cls) => `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r}"${cls ? ` class="${cls}"` : ''}/>`;
const txt = (x, y, s, size, cls = 'zh', extra = '') => `<text x="${x}" y="${y}" class="${cls}" font-size="${size}" text-anchor="middle"${extra}>${s}</text>`;
function blob(cx, cy, r, n = 9, j = .18) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, rr = r * (1 + (rand() - .5) * 2 * j); p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return smooth(p, true);
}
function wave(x1, x2, y, amp, step) {
  const p = []; let k = 0;
  for (let x = x1; x <= x2 + .1; x += step) p.push([x, y + (k++ % 2 ? amp : -amp) * (.6 + rand() * .4)]);
  return smooth(p);
}
const tree = (x, y, s = 1) => P(`M${x},${y} L${x},${y - 62 * s} M${x},${y - 38 * s} L${x + 15 * s},${y - 54 * s}`) + P(blob(x, y - 98 * s, 46 * s, 9, .16));
const conifer = (x, y, s = 1) => P(`M${x},${y - 210 * s} L${x - 34 * s},${y - 140 * s} L${x - 16 * s},${y - 140 * s} L${x - 54 * s},${y - 70 * s} L${x - 26 * s},${y - 70 * s} L${x - 74 * s},${y - 14 * s} L${x + 74 * s},${y - 14 * s} L${x + 26 * s},${y - 70 * s} L${x + 54 * s},${y - 70 * s} L${x + 16 * s},${y - 140 * s} L${x + 34 * s},${y - 140 * s} Z`) + P(`M${x},${y - 14 * s} L${x},${y}`);
const cloud = (x, y, s = 1) => P(`M${x - 62 * s},${y} Q${x - 74 * s},${y - 32 * s} ${x - 36 * s},${y - 36 * s} Q${x - 26 * s},${y - 68 * s} ${x + 6 * s},${y - 52 * s} Q${x + 36 * s},${y - 74 * s} ${x + 52 * s},${y - 36 * s} Q${x + 84 * s},${y - 30 * s} ${x + 66 * s},${y} Z`);
const tuft = (x, y, s = 1) => {
  let d = `M${r1(x - 12 * s)},${r1(y)} L${r1(x + 12 * s)},${r1(y)}`;
  for (const [a, l] of [[-62, 15], [-30, 21], [0, 25], [30, 21], [62, 15]]) {
    const t = a * Math.PI / 180, ex = x + Math.sin(t) * l * s, ey = y - Math.cos(t) * l * s;
    d += ` M${r1(x + a / 30 * s)},${r1(y)} Q${r1(x + Math.sin(t) * l * s * .3)},${r1(y - l * s * .6)} ${r1(ex)},${r1(ey)}`;
  }
  return P(d, 'fine');
};
const grass = (x, y, s = 1) => P(`M${x - 8 * s},${y} Q${x - 6 * s},${y - 14 * s} ${x - 14 * s},${y - 24 * s} M${x},${y} Q${x},${y - 18 * s} ${x + 3 * s},${y - 30 * s} M${x + 8 * s},${y} Q${x + 8 * s},${y - 13 * s} ${x + 16 * s},${y - 22 * s}`, 'fine');
const bush = (x, y, w) => P(`M${x - w},${y} C${x - w},${y - w * 1.1} ${x - w * .2},${y - w * 1.2} ${x},${y - w * .8} C${x + w * .3},${y - w * 1.25} ${x + w},${y - w} ${x + w},${y}`);
const star = (x, y, r) => P(`M${x},${y - r} Q${x},${y} ${x + r},${y} Q${x},${y} ${x},${y + r} Q${x},${y} ${x - r},${y} Q${x},${y} ${x},${y - r} Z`, 'w');
const heart = (x, y, s = 1) => P(`M${x},${y + 14 * s} C${x - 34 * s},${y - 8 * s} ${x - 16 * s},${y - 34 * s} ${x},${y - 16 * s} C${x + 16 * s},${y - 34 * s} ${x + 34 * s},${y - 8 * s} ${x},${y + 14 * s} Z`);
const asterisk = (x, y, s) => P(`M${x - s},${y} L${x + s},${y} M${x},${y - s} L${x},${y + s} M${x - .7 * s},${y - .7 * s} L${x + .7 * s},${y + .7 * s} M${x - .7 * s},${y + .7 * s} L${x + .7 * s},${y - .7 * s}`, 'thin');
const birds = (x, y, s = 1) => P(`M${x - 14 * s},${y - 6 * s} Q${x - 6 * s},${y - 10 * s} ${x},${y} Q${x + 6 * s},${y - 10 * s} ${x + 14 * s},${y - 6 * s}`, 'fine');
function fern(x, y, s = 1, dir = 1) {
  const q = t => [(1 - t) ** 2 * x + 2 * (1 - t) * t * (x + 10 * s * dir) + t * t * (x + 46 * s * dir), (1 - t) ** 2 * y + 2 * (1 - t) * t * (y - 70 * s) + t * t * (y - 104 * s)];
  let d = `M${x},${y} Q${x + 10 * s * dir},${y - 70 * s} ${x + 46 * s * dir},${y - 104 * s}`;
  for (let t = .25; t < .95; t += .14) { const [a, b] = q(t), l = 22 * s * (1 - t * .6); d += ` M${r1(a)},${r1(b)} l${r1(-l)},${r1(-l * .45)} M${r1(a)},${r1(b)} l${r1(l)},${r1(-l * .1)}`; }
  return P(d, 'fine');
}
function person(x, y, s = 1, o = {}) {
  const arms = o.up ? 'M0,-42 L-16,-62 M0,-42 L16,-62' : o.hold ? 'M0,-42 L-18,-32 M0,-42 L18,-32' : 'M0,-42 L-14,-24 M0,-42 L14,-24';
  let extra = '';
  if (o.skirt) extra += P('M0,-32 L-11,-16 L11,-16 Z');
  if (o.tails) extra += P('M-10,-64 q-10,4 -8,14 M10,-64 q10,4 8,14', 'fine');
  if (o.hat) extra += P('M-30,-66 L0,-88 L30,-66 Z');
  if (o.cube) extra += `<g class="cube"><polygon class="top" points="0,-96 12,-89 0,-82 -12,-89"/><polygon class="l" points="-12,-89 0,-82 0,-68 -12,-75"/><polygon class="r" points="12,-89 0,-82 0,-68 12,-75"/></g>`;
  return `<g transform="translate(${r1(x)},${r1(y)}) scale(${s})"><g class="${o.cls || ''}"><g class="kb">${circ(0, -58, 11)}${P(`M0,-47 L0,-20 M0,-20 L-9,0 M0,-20 L9,0 ${arms}`)}${extra}</g></g></g>`;
}
function penguin(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})"><g class="wad">
    ${P(smooth([[0, -150], [30, -142], [45, -102], [50, -52], [40, -12], [0, 0], [-40, -12], [-50, -52], [-45, -102], [-30, -142]], true), 'fb pbody')}
    ${P(smooth([[0, -112], [22, -94], [30, -52], [22, -16], [0, -9], [-22, -16], [-30, -52], [-22, -94]], true), 'fine')}
    ${P('M-45,-96 Q-76,-62 -62,-34')}${P('M45,-96 Q76,-62 62,-34')}
    ${P('M-26,0 L-10,5 M10,5 L26,0')}
    ${P('M-9,-114 L0,-100 L9,-114 Z', 'w')}
    ${circ(-13, -126, 4.5, 'w')}${circ(13, -126, 4.5, 'w')}
  </g></g>`;
}

/* ================= scene art ================= */
// ---------- Scene 2: school ----------
(() => {

}

/* ================= timeline ================= */
const tl = gsap.timeline({ paused: true });
const GEOM = 'path,line,circle,ellipse,rect,polyline,polygon';
const roots = sel => typeof sel === 'string' ? $$(sel) : [].concat(sel);

// Hand-draw every stroke under `sel`; white fills & text fade in near the end.
function draw(sel, at, dur = 1.5, ease = 'power1.inOut') {
  const els = [], fills = [];
  for (const r of roots(sel)) {
    const all = r.matches(GEOM) ? [r] : $$(GEOM + ',text', r);
    for (const e of all) {
      if (e.closest('.nodraw') && !r.classList.contains('nodraw') || e.closest('defs')) continue;
      if (e.tagName === 'text' || e.classList.contains('w')) fills.push(e); else els.push(e);
    }
  }
  els.forEach(e => {
    if (e.__len == null) { const L = Math.ceil(e.getTotalLength()) + 2; e.__len = L; e.style.strokeDasharray = `${L} ${L + 20}`; e.style.strokeDashoffset = L + 5; }
  });
  const st = Math.min(.05, dur * .55 / Math.max(1, els.length));
  if (els.length) tl.fromTo(els, { strokeDashoffset: (i, e) => e.__len + 5 }, { strokeDashoffset: 0, duration: Math.max(.25, dur - st * (els.length - 1)), stagger: st, ease }, at);
  if (fills.length) tl.fromTo(fills, { autoAlpha: 0 }, { autoAlpha: 1, duration: .5, stagger: .05 }, at + dur * .65);
}

// Paper plane along a path, with a dashed trail revealed through a mask.
let trailId = 0;
function fly(d, at, dur, { parent, scale = 1, ease = 'power1.inOut', phase = 0 } = {}) {
  tl.set('#plane', { autoAlpha: 1, scale }, at);
  tl.to('#plane', { motionPath: { path: d, autoRotate: true }, duration: dur, ease }, at);
  return parent ? dashed(d, parent, at, dur, ease, phase) : null;
}
// phase: length of the trail this one continues, so the 14/12 dash rhythm carries on seamlessly
function dashed(d, parent, at, dur, ease = 'power1.inOut', phase = 0) {
  const id = 'm' + (++trailId);
  const m = document.createElementNS(NS, 'mask');
  m.id = id; m.setAttribute('maskUnits', 'userSpaceOnUse');
  m.setAttribute('x', -600); m.setAttribute('y', -600); m.setAttribute('width', 5200); m.setAttribute('height', 2400);
  m.innerHTML = `<path d="${d}" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round"/>`;
  $('#defs').appendChild(m);
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('class', 't-dash nodraw'); p.setAttribute('mask', `url(#${id})`);
  $(parent).appendChild(p);
  const L = Math.ceil(p.getTotalLength()) + 2, mp = m.firstChild;
  mp.style.strokeDasharray = `${L} ${L + 60}`;
  if (phase) p.style.strokeDashoffset = -(phase % 26);
  p.__trailLen = phase + p.getTotalLength();
  tl.fromTo(mp, { strokeDashoffset: L + 30 }, { strokeDashoffset: 0, duration: dur, ease }, at);
  return p;
}
function sub(id, tin, tout) {
  tl.fromTo('#' + id, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: .6, ease: 'power2.out' }, tin);
  tl.to('#' + id, { autoAlpha: 0, y: -12, duration: .5, ease: 'power1.in' }, tout - .5);
}
function pageFlip(id, at, hide, show) {
  tl.set(id, { transformOrigin: '0% 50%', rotationY: 90 }, at);
  tl.to(id, { autoAlpha: 1, duration: .12 }, at);
  tl.to(id, { rotationY: 0, duration: .7, ease: 'power2.out' }, at);
  tl.set(hide, { autoAlpha: 0 }, at + .7);
  tl.set(show, { autoAlpha: 1 }, at + .7);
  tl.set(id, { transformOrigin: '100% 50%' }, at + 1.5);
  tl.to(id, { rotationY: -90, duration: .7, ease: 'power2.in' }, at + 1.5);
  tl.set(id, { autoAlpha: 0 }, at + 2.2);
}

const P8 = 'M-120,620 C300,380 640,760 960,560 S1600,360 2060,520';
fly(P8, 71.0, 3.0, { parent: '#s5', scale: 1.2 });
tl.fromTo('#c5r', { attr: { width: 0 } }, { attr: { width: 1920 }, duration: 3.0, ease: 'power1.inOut' }, 71.0);
draw('#ul5', 73.8, .9);
tl.fromTo('#stars5 path', { autoAlpha: 0, scale: 0, transformOrigin: '50% 50%' }, { autoAlpha: 1, scale: 1, rotation: 90, duration: .6, stagger: .15, ease: 'back.out(3)' }, 74.2);
tl.fromTo('#en5', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: .8 }, 74.6);
tl.to('#stars5 path', { scale: .55, duration: .45, yoyo: true, repeat: 3, stagger: .12, ease: 'sine.inOut' }, 75.0);
tl.fromTo('#s5 > g[clip-path]', { y: 0 }, { y: -8, duration: 1.1, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 74.8);
tl.to({}, { duration: 1 }, 76);

// plane is always "in the air": gentle bob + roll, and wind streaks streaming behind it
tl.fromTo('#planeBob', { y: -1.5, rotation: -3 }, { y: 1.5, rotation: 3, transformOrigin: '50% 50%', duration: .55, yoyo: true, repeat: 139, ease: 'sine.inOut' }, 0);
tl.fromTo('#plane .wind', { strokeDashoffset: 0 }, { strokeDashoffset: 24 * 450, duration: 77, ease: 'none' }, 0);

/* ================= hand-drawn "boiling" lines ================= */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) { let n = 1; setInterval(() => $('#turb').setAttribute('seed', (n = n % 4 + 1)), 120); }

/* ================= controls ================= */
const btnPlay = $('#btnPlay'), dots = $$('#dots button');
const scrub = $('#scrub'), fill = $('#fill'), knob = $('#knob'), tip = $('#tip'), clock = $('#clock');
const DUR = tl.duration(), fmt = t => t.toFixed(1) + 's';
const order = ['s1', 's2', 's3', 's4', 's5'];
function syncPlay() { const p = tl.paused() || tl.progress() === 1; btnPlay.textContent = p ? '▶' : '❚❚'; btnPlay.setAttribute('aria-label', p ? '播放' : '暫停'); }
tl.eventCallback('onUpdate', () => {
  const pc = tl.progress() * 100 + '%';
  fill.style.width = pc; knob.style.left = pc;
  clock.textContent = `${fmt(tl.time())} / ${fmt(DUR)}`;
  scrub.setAttribute('aria-valuenow', tl.time().toFixed(1));
  let cur = 0; order.forEach((l, i) => { if (tl.time() >= tl.labels[l] - .01) cur = i; });
  dots.forEach((d, i) => d.classList.toggle('on', i === cur));
});
tl.eventCallback('onComplete', syncPlay);
const go = l => { tl.seek(l, false); if (tl.progress() === 1) tl.pause(); syncPlay(); };
dots.forEach(d => d.addEventListener('click', () => go(d.dataset.l)));
btnPlay.addEventListener('click', () => { if (tl.progress() === 1) tl.restart(); else tl.paused(!tl.paused()); syncPlay(); });
$('#btnReplay').addEventListener('click', () => { tl.restart(); syncPlay(); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
  const cur = dots.findIndex(d => d.classList.contains('on'));
  if (e.key === 'ArrowRight' && cur < 4) go(order[cur + 1]);
  if (e.key === 'ArrowLeft') go(order[Math.max(0, tl.time() - tl.labels[order[cur]] > 1.5 ? cur : cur - 1)]);
  // , / . step 0.1s (hold Shift for 1s) — paused, for pinpointing a moment
  if (e.key === ',' || e.key === '<' || e.key === '.' || e.key === '>') {
    const step = (e.shiftKey ? 1 : .1) * (e.key === ',' || e.key === '<' ? -1 : 1);
    tl.pause(); seekTo(tl.time() + step);
  }
});

/* ================= time bar ================= */
scrub.setAttribute('aria-valuemax', DUR.toFixed(1));
clock.textContent = `0.0s / ${fmt(DUR)}`;
$('#marks').innerHTML = order.map((l, i) => `<div class="mark" style="left:${tl.labels[l] / DUR * 100}%"><b>${i + 1}</b></div>`).join('');
const timeAt = x => { const r = $('#track').getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * DUR; };
function seekTo(t) { tl.seek(Math.max(0, Math.min(DUR, Math.round(t * 10) / 10)), false); syncPlay(); }
function showTip(t, x) { const r = scrub.getBoundingClientRect(); tip.textContent = fmt(t); tip.style.left = (x - r.left) + 'px'; }
let resume = false;
scrub.addEventListener('pointerdown', e => {
  scrub.setPointerCapture(e.pointerId); scrub.classList.add('drag');
  resume = !tl.paused() && tl.progress() < 1; tl.pause();
  const t = timeAt(e.clientX); seekTo(t); showTip(t, e.clientX);
});
scrub.addEventListener('pointermove', e => {
  const t = timeAt(e.clientX); showTip(t, e.clientX);
  if (scrub.classList.contains('drag')) seekTo(t);
});
const endDrag = () => { if (!scrub.classList.contains('drag')) return; scrub.classList.remove('drag'); if (resume) tl.play(); syncPlay(); };
scrub.addEventListener('pointerup', endDrag);
scrub.addEventListener('pointercancel', endDrag);

let idleT;
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!tl.paused() && tl.progress() < 1 && !scrub.classList.contains('drag')) document.body.classList.add('idle'); }, 2500);
}
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
tl.eventCallback('onComplete', () => { syncPlay(); wake(); });
wake();

const toast = $('#toast'); let toastT;
clock.addEventListener('click', () => {
  const s = fmt(tl.time());
  (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => { toast.textContent = `已複製時間 ${s}`; }, () => { toast.textContent = `目前時間 ${s}`; })
    .finally(() => { toast.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => toast.style.opacity = 0, 1400); });
});

/* ================= music: locked to the timeline =================
   starts at 6.0s · each pass eases out over its last beats, then a short breath so the next pass
   re-enters on the downbeat of the next bar (小苗快長大 ≈ 142 BPM, bar ≈ 1.69s) · whole film fades out over the last 3s */
const MUSIC_START = 6.0, MUSIC_FADE = 3;
const BAR = 4 * 0.4225, TAIL_FADE = 1.2, HEAD_FADE = .08;
let MUSIC_GAP = .4;
const musicGap = len => { let g = Math.ceil(len / BAR) * BAR - len; if (g < .3) g += BAR; return g; };
const bgm = $('#bgm'), btnMusic = $('#btnMusic');
let musicOn = true, musicOk = true, blocked = false, justUnlocked = false;
function noMusic() { musicOk = false; btnMusic.disabled = true; btnMusic.classList.remove('on'); btnMusic.title = '找不到音樂檔：請把「小苗快長大 (2).mp3」放在同一資料夾'; }
bgm.addEventListener('error', noMusic);
['loadedmetadata', 'durationchange'].forEach(ev => bgm.addEventListener(ev, () => { if (bgm.duration) MUSIC_GAP = musicGap(bgm.duration); }));
if (bgm.duration) MUSIC_GAP = musicGap(bgm.duration);   // metadata may already be loaded
function musicTarget() {   // where the track should be at the current timeline time (null = silent)
  const t = tl.time(), len = bgm.duration;
  if (!len || t < MUSIC_START || t >= DUR - .05) return null;
  const within = (t - MUSIC_START) % (len + MUSIC_GAP);
  return within < len ? within : null;
}
gsap.ticker.add(() => {
  if (!musicOk) return;
  const pos = musicTarget(), running = !tl.paused() && tl.progress() < 1 && !scrub.classList.contains('drag');
  const clamp = v => Math.max(0, Math.min(1, v)), len = bgm.duration || 1;
  const ease = pos === null ? 0 : Math.min(clamp(pos / HEAD_FADE), Math.sin(clamp((len - pos) / TAIL_FADE) * Math.PI / 2));
  bgm.volume = clamp((DUR - tl.time()) / MUSIC_FADE) * ease;
  if (!musicOn || pos === null || !running) { if (!bgm.paused) bgm.pause(); if (pos !== null && Math.abs(bgm.currentTime - pos) > .25) bgm.currentTime = pos; return; }
  if (Math.abs(bgm.currentTime - pos) > .3) bgm.currentTime = pos;
  if (bgm.paused && !blocked) bgm.play().catch(e => { if (e.name === 'NotAllowedError') { blocked = true; btnMusic.title = '瀏覽器擋住自動播放：點一下畫面或按 ♪ 開始音樂'; } });
});
// browsers only allow sound after a user gesture — the first click / key unlocks it
const unlock = () => { if (blocked) { blocked = false; justUnlocked = true; setTimeout(() => justUnlocked = false, 400); btnMusic.title = '背景音樂'; } };
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, unlock));
btnMusic.addEventListener('click', () => {
  if (justUnlocked) { musicOn = true; btnMusic.classList.add('on'); return; }   // this click was the unlock
  musicOn = !musicOn;
  btnMusic.classList.toggle('on', musicOn);
  if (!musicOn) bgm.pause();
});
btnMusic.classList.add('on');

/* ================= start once fonts are ready ================= */
Promise.race([
  Promise.all([document.fonts.load('700 60px "LXGW WenKai TC"', '多元選修到底要選什麼國際新視界內壢高中一起認真的玩快樂的學'), document.fonts.load('700 60px "Caveat"', 'Who am I')]),
  new Promise(r => setTimeout(r, 3000))
]).finally(() => { tl.play(0); syncPlay(); });
</script>
</body>
</html>
